services:
  db:
    image: postgres:16
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./API_Flay_Rank/sql/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tasks -d tasks"]
      interval: 2s
      timeout: 5s
      retries: 20
  app:
    build: ./API_Flay_Rank
    environment:
      DATABASE_URL: postgresql://tasks:tasks@db:5432/tasks
    ports:
      - "8001:8000"
    depends_on:
      db:
        condition: service_healthy
volumes:
  pgdata: